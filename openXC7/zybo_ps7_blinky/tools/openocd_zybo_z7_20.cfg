# OpenOCD interface+target config for JTAG debug-run on the Zybo Z7-20
# (Zynq-7020, xc7z020clg400-1), skipping SD/QSPI/FSBL entirely: halt the
# ARM core, run PS7 init by hand, load an ELF straight into memory, jump
# to it.
#
# Interface: openFPGALoader talks to this board's onboard FTDI JTAG as a
# plain, unconfigured "direct ft2232 interface", so it's presumably just
# the FT2232H's standard MPSSE JTAG pins (TCK/TDI/TDO/TMS) wired straight
# to the Zynq, with no external buffer/mux needing extra GPIO control.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
# From interface/ftdi/digilent-hs1.cfg (exact VID:PID match, explicitly
# documented as also covering "the OEM on-board version"): just
# TCK/TDI/TDO/TMS, no extra buffer/mux signals to drive.
ftdi layout_init 0x0088 0x008b

transport select jtag
reset_config none

# Target: trimmed copy of upstream target/zynq_7000.cfg, dropping its
# PLD/virtex2 bitstream-loading section (not needed -- openFPGALoader
# already does that -- and broken anyway in the oss-cad-suite OpenOCD
# build: `$zynq_pl.pld` is invalid Tcl, "can't read zynq_pl: no such
# variable").
set _CHIPNAME zynq
set _TARGETNAME $_CHIPNAME.cpu

jtag newtap zynq_pl bs -irlen 6 -ignore-version -ircapture 0x1 -irmask 0x03 \
    -expected-id 0x03727093

jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x4ba00477

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

target create ${_TARGETNAME}0 cortex_a -dap $_CHIPNAME.dap \
    -coreid 0 -dbgbase 0x80090000
target create ${_TARGETNAME}1 cortex_a -dap $_CHIPNAME.dap \
    -coreid 1 -dbgbase 0x80092000

adapter speed 1000

${_TARGETNAME}0 configure -event reset-assert-post "cortex_a dbginit"
${_TARGETNAME}1 configure -event reset-assert-post "cortex_a dbginit"
